<!DOCTYPE html>
<html>
<head><title>Nova Auth Callback</title></head>
<body style="font-family:sans-serif;padding:40px;max-width:600px">
<h2>TikTok Authorization</h2>
<div id="out"></div>
<script>
const p = new URLSearchParams(window.location.search);
const code = p.get('code');
const error = p.get('error');
if (error) {
  document.getElementById('out').innerHTML = '<p style="color:red">Error: ' + error + ' — ' + p.get('error_description') + '</p>';
} else if (code) {
  document.getElementById('out').innerHTML = '<p style="color:green">✓ Got authorization code. Copy it below and paste it in Terminal:</p><textarea style="width:100%;height:80px;font-size:13px">' + code + '</textarea>';
} else {
  document.getElementById('out').innerHTML = '<p>No code found.</p>';
}
</script>
</body>
</html>
